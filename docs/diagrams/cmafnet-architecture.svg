<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-label="CMAFNet Multimodal Blended Emotion Recognition Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141932"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
    <style>
      .t { font: 700 20px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .s { font: 400 12px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .zone { fill: #131c36; stroke: #293b66; stroke-width: 1.5; rx: 14; }
      .zl { font: 700 11px 'Inter', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.08em; fill: #fb7185; text-transform: uppercase; }
      .box { fill: #251b38; stroke: #f43f5e; stroke-width: 1.3; rx: 10; }
      .box-tr { fill: #1b284c; stroke: #38bdf8; stroke-width: 1.3; rx: 10; }
      .box-ok { fill: #132c37; stroke: #10b981; stroke-width: 1.4; rx: 10; }
      .bt { font: 600 13px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f1f5f9; }
      .bs { font: 400 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .e { stroke: #fb7185; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1120" height="580" fill="url(#bg)"/>
  <text x="34" y="40" class="t">BlEmoRe @ IEEE FG 2026 &#8212; CMAFNet Cross-Modal Attentive Fusion</text>
  <text x="34" y="60" class="s">First-Author Shared-Task Manuscript &#183; 8,448-d Audio/Visual Tokens &#183; 21 Blended Emotion Combos + 3 Salience Tiers &#183; 5-Fold True OOF Ensemble</text>

  <!-- Row 1: Modalities -->
  <rect x="34" y="84" width="1052" height="134" class="zone"/>
  <text x="50" y="106" class="zl">1. Temporal Modality Pooling (Mean + Max over Frame Axis &#183; 2,456 Train / 594 Test Clips)</text>
  <rect x="52" y="122" width="240" height="78" class="box"/>
  <text x="68" y="146" class="bt">VideoMAEv2</text>
  <text x="68" y="166" class="bs">2,816-d spatiotemporal feats</text>
  <text x="68" y="183" class="bs">mean + max pooled vector</text>

  <rect x="310" y="122" width="240" height="78" class="box"/>
  <text x="326" y="146" class="bt">VideoSwinTransformer</text>
  <text x="326" y="166" class="bs">1,536-d hierarchical vision</text>
  <text x="326" y="183" class="bs">mean + max pooled vector</text>

  <rect x="568" y="122" width="240" height="78" class="box"/>
  <text x="584" y="146" class="bt">WavLM-Large</text>
  <text x="584" y="166" class="bs">2,048-d vocal acoustics</text>
  <text x="584" y="183" class="bs">speech prosody &amp; affect</text>

  <rect x="826" y="122" width="242" height="78" class="box"/>
  <text x="842" y="146" class="bt">HuBERT-Large</text>
  <text x="842" y="166" class="bs">2,048-d audio speech rep</text>
  <text x="842" y="183" class="bs">modality drop (p=0.15) reg</text>

  <!-- Row 2: CMAFNet -->
  <rect x="34" y="244" width="1052" height="148" class="zone"/>
  <text x="50" y="266" class="zl">2. Cross-Modal Attentive Fusion Transformer (cmaf_s / cmaf_m / cmaf_l / cmaf_xl)</text>
  <rect x="52" y="282" width="320" height="92" class="box-tr"/>
  <text x="68" y="304" class="bt">Modality Tokenizers + [CLS]</text>
  <text x="68" y="324" class="bs">Independent projection + LayerNorm</text>
  <text x="68" y="341" class="bs">Each modality = 1 Transformer token</text>
  <text x="68" y="358" class="bs">Feature-space Mixup + Gaussian noise</text>

  <rect x="400" y="282" width="336" height="92" class="box-tr"/>
  <text x="416" y="304" class="bt">Self-Attention &amp; Attention Pooling</text>
  <text x="416" y="324" class="bs">All-to-all cross-modal attention</text>
  <text x="416" y="341" class="bs">Context-aware attention pooling</text>
  <text x="416" y="358" class="bs">Focal CE (gamma=2) + label smoothing</text>

  <rect x="764" y="282" width="304" height="92" class="box-ok"/>
  <text x="780" y="304" class="bt">Dual Multi-Task Output Heads</text>
  <text x="780" y="324" class="bs">Combo Head: 21 classes (6+15 pairs)</text>
  <text x="780" y="341" class="bs">Salience Head: {70/30, 50/50, 30/70}</text>
  <text x="780" y="358" class="bs">SWA + top-K fold/variant ensemble</text>

  <!-- Row 3: 5-fold True OOF Benchmarks -->
  <rect x="34" y="418" width="1052" height="136" class="zone"/>
  <text x="50" y="440" class="zl">3. True Out-of-Fold 5-Fold Cross-Validation Results (n = 2,456 &#183; 54% Blended Clips)</text>
  <rect x="52" y="458" width="1016" height="78" class="box-ok"/>
  <text x="72" y="484" class="bs" fill="#34d399">CMAFNet 5-Fold OOF Ensemble:  ACC_presence = 0.3805  |  ACC_salience = 0.1307  |  Avg = 0.2556</text>
  <text x="72" y="505" class="bs">Baselines:  ImageBind+WavLM (pres 0.345)  &#183;  VideoMAEv2+HuBERT (pres 0.332)  &#183;  HiCMAE (pres 0.298)  &#183;  Trivial (0.077)</text>
  <text x="72" y="524" class="bs">IEEE FG 2026 Leaderboard: 9th (0.323 pres / 0.180 sal / 0.251 Avg) above HiCMAE (0.2240) &amp; VideoMAEv2+HuBERT (0.2230).</text>

  <path d="M 172 200 L 172 282" class="e"/>
  <path d="M 430 200 L 250 282" class="e"/>
  <path d="M 688 200 L 320 282" class="e"/>
  <path d="M 947 200 L 350 282" class="e"/>
  <path d="M 372 328 L 400 328" class="e"/>
  <path d="M 736 328 L 764 328" class="e"/>
  <path d="M 916 374 L 560 458" class="e"/>
</svg>
